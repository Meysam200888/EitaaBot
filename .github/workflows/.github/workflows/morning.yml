```yaml
name: Eitaa Morning Message

on:
  schedule:
    # ساعت 06:00 به وقت UTC
    # اگر منطقه زمانی تو UTC+3:30 باشد، این ساعت حدود 09:30 محلی است.
    - cron: "30 2 * * *"

  workflow_dispatch:

jobs:
  send-morning:
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Send messages
        env:
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
        run: python morning_sender.py
```
